<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" role="img" aria-label="InvoiceChaser">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;display=swap');</style></defs>
<g>
  <rect width="64" height="64" rx="15" fill="#0C2328"/>
  <!-- invoice sheet with folded corner -->
  <path d="M15 12h20l9 9v25a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3z" fill="#F6F8F7"/>
  <path d="M35 12v6a3 3 0 0 0 3 3h6z" fill="#B9CFCB"/>
  <!-- line items -->
  <rect x="18" y="20" width="11" height="3" rx="1.5" fill="#B9CFCB"/>
  <rect x="18" y="26" width="16" height="3" rx="1.5" fill="#B9CFCB"/>
  <!-- paid check -->
  <path d="M19 38l5 5 10-11" fill="none" stroke="#0B8A6B" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chase arc closing around the sheet -->
  <path d="M51.5 27a19 19 0 0 1-15 26.5" fill="none" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
  <path d="M38.5 47.5l-6 6.2 6.6 4.6" fill="none" stroke="#D9A441" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="78" y="43" font-family="'Bricolage Grotesque','Segoe UI',Arial,sans-serif" font-weight="800" font-size="31" letter-spacing="-0.6" fill="#F6F8F7">Invoice<tspan fill="#6FD3B7">Chaser</tspan></text>
</svg>